<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To-Do</title>
        <link rel="stylesheet" href="./css/index.css" />
    </head>
    <body>
        <div id="app" class="flex h-dvh items-start justify-center p-10">
            <main
                id="main-area"
                class="flex flex-col items-center justify-start gap-1 rounded-2xl border p-10"
            >
                <h1 class="text-5xl font-black">To-Do List</h1>
                <form>
                    <fieldset id="add">
                        <legend class="py-3 text-xs">할 일 추가</legend>
                        <div class="flex flex-row gap-3 max-sm:flex-col">
                            <input
                                type="text"
                                class="rounded-lg border p-1"
                                placeholder="할 일 입력..."
                                required
                                id="add-todo"
                            />
                            <input
                                type="datetime-local"
                                class="rounded-lg border p-1"
                                id="add-due-date"
                            />
                            <button
                                type="submit"
                                id="add-button"
                                class="rounded-xl bg-purple-400 p-2 hover:cursor-pointer"
                            >
                                추가
                            </button>
                        </div>
                    </fieldset>
                </form>
                <p class="m-1 self-start py-3 text-xs">할 일 목록</p>
                <ol
                    class="flex w-full list-inside list-decimal flex-col gap-5"
                    id="to-do-list"
                >
                    <li
                        class="flex flex-row justify-between rounded border p-3"
                    >
                        <div>치킨 먹기</div>
                        <div>2026-05-15</div>
                    </li>
                    <li
                        class="flex flex-row justify-between rounded border p-3"
                    >
                        <div>치킨 먹기</div>
                        <div>2026-05-15</div>
                    </li>
                </ol>
            </main>
        </div>

        <script type="module" src="./src/index.ts"></script>
    </body>
</html>
